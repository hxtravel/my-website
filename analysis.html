    <style>
        :root { --sky-blue: #00aaff; --deep-blue: #006699; --bg-color: #e6f0f8; --white: #ffffff; --line-green: #06c755; }

        nav { background: var(--white); padding: 0 8%; display: flex; justify-content: space-between; align-items: center; height: 80px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); position: sticky; top: 0; z-index: 1000; }
        .logo-img { height: 60px; }
        .nav-links { list-style: none; display: flex; align-items: center; gap: 25px; }
        .nav-links a { text-decoration: none; color: var(--deep-blue); font-weight: 700; }
        .nav-line-btn { background: var(--line-green); color: white !important; padding: 10px 25px; border-radius: 50px; text-decoration: none; }
        .container { max-width: 1000px; margin: 40px auto; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow-x: auto; }

        th, td { padding: 20px; border-bottom: 1px solid #eee; text-align: left; }
        th { background: #f4f8fb; color: var(--deep-blue); }
        .best-choice { background: rgba(0, 170, 255, 0.05); font-weight: bold; border-left: 3px solid var(--sky-blue); }

    <div class="container">
        <h1 style="text-align: center; color: var(--deep-blue); margin-bottom: 30px;">補貼行程 vs 無購物行程</h1>
        <table>
            <thead>
                <tr><th>比較項目</th><th class="best-choice">【和諧特惠】含購物站補貼</th><th>【一般高價】全程無購物</th></tr>
            </thead>
            <tbody>
                <tr><td>預算支出</td><td class="best-choice"><span class="red-tag">省下 40% - 60% 團費</span></td><td>全額負擔，門檻較高</td></tr>
                <tr><td>飯店規格</td><td class="best-choice">保證升等五星飯店/連鎖品牌</td><td>多為標準商旅或四星標配</td></tr>
                <tr><td>景點時間</td><td>每站停留 40-60 分鐘購物兼休息</td><td>景點停留多約 15% 時間</td></tr>
                <tr><td>體力消耗</td><td class="best-choice">有吹冷氣中繼站，適合長輩小孩</td><td>景點拉車連貫，體力要求較大</td></tr>
                <tr><td>餐食內容</td><td class="best-choice">預算充足，可享特色大餐/龍蝦餐</td><td>受限預算，多為標準團餐</td></tr>
                <tr><td>綜合 CP 值</td><td class="best-choice"><span class="red-tag">⭐⭐⭐⭐⭐ (壓倒性勝出)</span></td><td>⭐⭐⭐ (適合不計預算者)</td></tr>
            </tbody>
        </table>
    </div>
