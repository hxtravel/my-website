<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>夢幻假期 | 您的專屬旅行顧問</title>
    <style>
        /* 基礎設定 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft JhengHei", Arial, sans-serif; line-height: 1.6; color: #333; }
        
        /* 導航欄 */
        nav { background: #fff; height: 70px; display: flex; justify-content: space-between; align-items: center; padding: 0 5%; position: sticky; top: 0; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .logo { font-size: 1.5rem; font-weight: bold; color: #ff7675; }
        .nav-links { list-style: none; display: flex; }
        .nav-links li { margin-left: 20px; }
        .nav-links a { text-decoration: none; color: #333; font-weight: 500; transition: 0.3s; }
        .nav-links a:hover { color: #ff7675; }

        /* 英雄區塊 (Hero Section) */
        .hero { 
            height: 80vh; 
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1350&q=80');
            background-size: cover; background-position: center;
            display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; padding: 0 20px;
        }
        .hero h1 { font-size: 3rem; margin-bottom: 1rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .hero p { font-size: 1.2rem; margin-bottom: 2rem; }
        .cta-btn { padding: 12px 35px; background: #ff7675; color: white; text-decoration: none; border-radius: 30px; font-size: 1.1rem; transition: 0.3s; }
        .cta-btn:hover { background: #d63031; transform: scale(1.05); }

        /* 行程區塊 */
        .tours { padding: 80px 5%; background: #f9f9f9; }
        .section-title { text-align: center; margin-bottom: 50px; }
        .tour-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; }
        .tour-card { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.1); transition: 0.3s; }
        .tour-card:hover { transform: translateY(-10px); }
        .tour-img { width: 100%; height: 200px; object-fit: cover; }
        .tour-info { padding: 20px; }
        .tour-price { color: #ff7675; font-weight: bold; font-size: 1.2rem; }

        /* 頁尾 */
        footer { background: #2d3436; color: white; text-align: center; padding: 40px 0; }
        
        /* 手機版調整 */
        @media (max-width: 768px) {
            .hero h1 { font-size: 2rem; }
            .nav-links { display: none; } /* 簡化處理，手機隱藏導航 */
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">✈️ 夢幻假期</div>
        <ul class="nav-links">
            <li><a href="#">首頁</a></li>
            <li><a href="#">熱門行程</a></li>
            <li><a href="#">關於我們</a></li>
            <li><a href="#">聯絡我們</a></li>
        </ul>
    </nav>

    <header class="hero">
        <h1>探索世界的美好</h1>
        <p>從熱帶海灘到極地冒險，我們為您規劃最完美的旅程。</p>
        <a href="#tours" class="cta-btn">立即出發</a>
    </header>

    <section class="tours" id="tours">
        <div class="section-title">
            <h2>熱門精選行程</h2>
            <p>本季最受歡迎的度假勝地</p>
        </div>
        <div class="tour-grid">
            <div class="tour-card">
                <img src="https://images.unsplash.com/photo-1537996194471-e657df975ab4?auto=format&fit=crop&w=500&q=80" alt="峇里島" class="tour-img">
                <div class="tour-info">
                    <h3>峇里島五日放鬆之旅</h3>
                    <p>享受私人別墅與湛藍海景...</p>
                    <div class="tour-price">TWD 29,900 起</div>
                </div>
            </div>
            <div class="tour-card">
                <img src="https://images.unsplash.com/photo-1523906834658-6e24ef2386f9?auto=format&fit=crop&w=500&q=80" alt="威尼斯" class="tour-img">
                <div class="tour-info">
                    <h3>浪漫威尼斯水都遊</h3>
                    <p>沉浸在義大利的古老浪漫中...</p>
                    <div class="tour-price">TWD 88,500 起</div>
                </div>
            </div>
            <div class="tour-card">
                <img src="https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?auto=format&fit=crop&w=500&q=80" alt="京都" class="tour-img">
                <div class="tour-info">
                    <h3>古都京都賞櫻團</h3>
                    <p>漫步在粉紅色的櫻花隧道下...</p>
                    <div class="tour-price">TWD 35,000 起</div>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 夢幻假期旅行社. All Rights Reserved.</p>
        <p>台北市某某路123號 | 02-1234-5678</p>
    </footer>

</body>
</html>
