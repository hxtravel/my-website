<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>最新行程 | 和諧旅遊</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --sky-blue: #00aaff; --deep-blue: #006699; --bg-color: #e6f0f8; --white: #ffffff; --line-green: #06c755; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans TC', sans-serif; background-color: var(--bg-color); display: flex; flex-direction: column; min-height: 100vh; }
        nav { background: var(--white); padding: 0 8%; display: flex; justify-content: space-between; align-items: center; height: 80px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); position: sticky; top: 0; z-index: 1000; }
        .logo-img { height: 55px; }
        .nav-links { list-style: none; display: flex; align-items: center; gap: 25px; }
        .nav-links a { text-decoration: none; color: var(--deep-blue); font-weight: 700; }
        .nav-line-btn { background: var(--line-green); color: white !important; padding: 10px 25px; border-radius: 50px; text-decoration: none; }
        .content { flex: 1; padding: 40px 5%; max-width: 1200px; margin: 0 auto; width: 100%; }
        .tab-menu { display: flex; justify-content: center; margin-bottom: 40px; gap: 15px; }
        .tab-btn { padding: 12px 35px; border: 2px solid var(--sky-blue); border-radius: 50px; cursor: pointer; background: white; font-weight: bold; color: var(--deep-blue); }
        .tab-btn.active { background: var(--sky-blue); color: white; }
        .tab-content { display: none; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
        .tab-content.active { display: grid; }
        .tour-card { background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .tour-img { width: 100%; height: 220px; object-fit: cover; }
        .tour-info { padding: 25px; }
        footer { background: #1a202c; color: white; padding: 40px 20px; text-align: center; width: 100%; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html"><img src="LOGO.png" class="logo-img"></a>
        <ul class="nav-links">
            <li><a href="index.html">首頁</a></li>
            <li><a href="tours.html">最新行程</a></li>
            <li><a href="analysis.html">購物站釋疑</a></li>
            <li><a href="qa.html">常見問題</a></li>
            <li><a href="https://lin.ee/7WGlamz" class="nav-line-btn">LINE 諮詢</a></li>
        </ul>
    </nav>
    <div class="content">
        <h1 style="text-align: center; color: var(--deep-blue); margin-bottom: 40px;">精選推薦行程</h1>
        <div class="tab-menu">
            <button class="tab-btn active" onclick="openTab(event, 'North')">東北亞團</button>
            <button class="tab-btn" onclick="openTab(event, 'South')">東南亞團</button>
        </div>
        <div id="North" class="tab-content active">
            <div class="tour-card"><img src="https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?w=500" class="tour-img"><div class="tour-info"><h3>日韓五星深度遊</h3><p>奢華住宿，東北亞補貼超值首選。</p></div></div>
        </div>
        <div id="South" class="tab-content">
            <div class="tour-card"><img src="https://images.unsplash.com/photo-1528127269322-539801943592?w=500" class="tour-img"><div class="tour-info"><h3>曼谷豪華度假</h3><p>入住湄南河畔，享用泰式頂級大盛。</p></div></div>
        </div>
    </div>
    <footer>
        <p>和諧旅遊 © 2026 | 地址：桃園市桃園區朝陽街一段92號</p>
        <p>統一編號：54540709 | 觀光署執照編號：754100</p>
    </footer>
    <script>
        function openTab(evt, name) {
            var i, tabcontent = document.getElementsByClassName("tab-content"), tablinks = document.getElementsByClassName("tab-btn");
            for (i = 0; i < tabcontent.length; i++) tabcontent[i].style.display = "none";
            for (i = 0; i < tablinks.length; i++) tablinks[i].classList.remove("active");
            document.getElementById(name).style.display = "grid";
            evt.currentTarget.classList.add("active");
        }
    </script>
</body>
</html>
